<div class="categorey-wrapper-new">
    <div class="top-section">
        <div class="svg_img">
            <img src="assets/images/icons/message.svg" alt="Image">
        </div>
        <p>{{'ASSOCIATED_WORK_NOTES' | translate}}</p>
    </div>
    
        <div id="accordionResponseArray" class="categorey-accordion-wrapper">
            <ng-container *ngFor="let workNote of automationObj.elements; let i = index">
                <div (click)="toggleCollapse(i)" class="category_link collapsed">
                <!-- <div data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse-'+i+'-'+responseArrayIndex" [attr.href]="'#collapse-'+i+'-'+responseArrayIndex" class="categorey_link collapsed"
                    aria-expanded="false"> -->
                    <div class="categorey-content-header-btn">
                        <div class="categorey-title-block">
                            <div class="categorey-title">
                                {{workNote?.categoryTitle}}
                            </div>
                            <div class="categorey-divider"></div>
                            <div class="categorey-des">
                                {{workNote?.subCategoryTitle}}
                            </div>
                        </div>
                        <i class="krIocnsFont-chevron-down arrow-icon" *ngIf="!isCollapsed[i]"></i>
                        <i class="krIocnsFont-chevron-up arrow-icon" *ngIf="isCollapsed[i]"></i>
                    </div>
                </div>
                <div [id]="'collapse-'+i" class="collapse" [ngClass]="{'show': isCollapsed[i]}">
                <!-- <div id="collapse-{{i}}-{{responseArrayIndex}}" class="collapse" data-bs-parent="#accordionResponseArray"> -->
                    <div class="categorey-content-body">
                        <p class="title">{{workNote?.title | titlecase}}</p>
                        <div class="categorey-content-header" [innerHTML]="workNote?.description">
                            <!-- {{}} -->
                        </div>
                        <div class="categorey-content-footer">
                            {{workNote.feedbackMessage || 'Was it helpful?'}}
                            <button (click)="workNoteFeedBack(true, workNote)" [disabled]="workNote.feedback === 'dislike' "
                             class="feedback-btn-thumb" [ngClass]="{'active-feedback-btn': workNote.feedback === 'like'}"><i class="krIocnsFont-thumbs-up-solid"></i></button>
                            <button (click)="workNoteFeedBack(false, workNote)" [disabled]="workNote.feedback === 'like' "
                            class="feedback-btn-thumb" [ngClass]="{'active-feedback-btn': workNote.feedback === 'dislike'}"><i class="krIocnsFont-thumbs-down"></i></button>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
</div>
