<div class="api-advance-mode-wrapper" [ngClass]="{'fullscreen' : isFullscreen}">
    <div class="header-sec">
       <h3 class="title">Advance API Configuration</h3>
       <i class="icon-sa-close" (click)="cancel()"></i>
    </div>
    <div class="body-sec">
        <div class="editor-heading">Define Script</div>
     <!-- <p class="define-script">Define script</p> -->
     <!-- <ace-editor
       [(text)]="apiScript"
        #editor 
        [options]="editorOptions"
        [ngStyle]="{'height': modalHeight}"
        ></ace-editor> -->
        <div class="fullview-icon" (click)="expandModal()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" *ngIf="!isFullscreen">
                <path d="M5.33333 2H5.2C4.0799 2 3.51984 2 3.09202 2.21799C2.71569 2.40973 2.40973 2.71569 2.21799 3.09202C2 3.51984 2 4.0799 2 5.2V5.33333M5.33333 14H5.2C4.0799 14 3.51984 14 3.09202 13.782C2.71569 13.5903 2.40973 13.2843 2.21799 12.908C2 12.4802 2 11.9201 2 10.8V10.6667M14 5.33333V5.2C14 4.07989 14 3.51984 13.782 3.09202C13.5903 2.71569 13.2843 2.40973 12.908 2.21799C12.4802 2 11.9201 2 10.8 2H10.6667M14 10.6667V10.8C14 11.9201 14 12.4802 13.782 12.908C13.5903 13.2843 13.2843 13.5903 12.908 13.782C12.4802 14 11.9201 14 10.8 14H10.6667" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" *ngIf="isFullscreen">
                <path
                    d="M2 5.33333H2.13333C3.25344 5.33333 3.81349 5.33333 4.24131 5.11535C4.61764 4.9236 4.9236 4.61764 5.11535 4.24131C5.33333 3.81349 5.33333 3.25344 5.33333 2.13333V2M2 10.6667H2.13333C3.25344 10.6667 3.81349 10.6667 4.24131 10.8847C4.61764 11.0764 4.9236 11.3824 5.11535 11.7587C5.33333 12.1865 5.33333 12.7466 5.33333 13.8667V14M10.6667 2V2.13333C10.6667 3.25344 10.6667 3.81349 10.8847 4.24131C11.0764 4.61764 11.3824 4.9236 11.7587 5.11535C12.1865 5.33333 12.7466 5.33333 13.8667 5.33333H14M10.6667 14V13.8667C10.6667 12.7466 10.6667 12.1865 10.8847 11.7587C11.0764 11.3824 11.3824 11.0764 11.7587 10.8847C12.1865 10.6667 12.7466 10.6667 13.8667 10.6667H14"
                    stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
    </div>
    <div class="footer-sec">
        <!-- <button  (click)="copyInputMessage(apiScript)">copy</button> -->
        <div class="copy-btn" placement="bottom-left" (click)="copyInputMessage(apiScript)">
            <i class="icon-sa-copy"></i>Copy
        </div>
        <div class="footer-sec-action">
            <button class="kr-sg-button-secondary-two btn_lg" (click)="cancel()" >{{'BUTTONS.CANCEL' | translate}}</button>
            <button class="kr-sg-button-primary btn_lg" [disabled]="apiScript?.length === 0" (click)="save()" >{{'BUTTONS.SAVE' | translate}}</button>
        </div>
    </div>
</div>
