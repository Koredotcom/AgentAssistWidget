<div class="date-channels-container">
    <div class="left-title" (click)="navigateTabs('/dashboard')">{{"DASHBOARD.TITLE" | translate}}</div>
    <div class="left-title" (click)="navigateTabs('/roianalyser')">{{"ROI_ANALYSER_TITLE" | translate}}</div>
    <div class="right-sec-actions">
      <!-- Calender -->
        <div class="custom_date_picker_sec date-sec-info ngx-daterangepicker-action" (click)="openPicker()">
            <i class="icon-ast_calendar"></i>
            <i class="icon-sa-calendar ngx-daterangepicker-action" (click)="openPicker()"></i>
            <input type="text"
                readonly
                ngxDaterangepickerMd
                [timePicker]="true"
                [alwaysShowCalendars]="true"
                [keepCalendarOpeningWithRange]="true"
                [ranges]="ranges"
                [showCustomRangeLabel]="true"
                [showRangeLabelOnInput]="true"
                [linkedCalendars]="true"
                showCancel="true"
                [locale]="{format: 'DD/MM/YYYY hh:mm', displayFormat: 'MM/DD/YYYY hh:mm A'}"
                [isInvalidDate]="isInvalidDate"
                [(ngModel)]="selected"
                class="input-date-custom"
                [locale] = "calendarLocale" (datesUpdated)="onDatesUpdated($event)"/>
        </div>
        <!-- Bot List -->
        <div class="kr-sg-dropdowns channels-drpdowns" ngbDropdown placement="bottom-right">
            <div class="dropdown-open">
                <button type="button" class="dropdown-toggle before-none dropdown-input" id="repdropdown1" ngbDropdownToggle>
                    <i class="icon-sa-conv-mybot"></i>
                    <span class="title-text">{{( this.selectedBot)}}</span>
                    <!-- <span class="count-channels">2</span> -->
                </button>
                <ul class="content-menu" aria-labelledby="repdropdown1" ngbDropdownMenu>
                    <perfect-scrollbar>
                        <div class="scroll-data mx-h-280">
                            <li ngbDropdownItem class="channel-name m_b_2" *ngFor="let bot of botList" (click)="changeBot(bot)">
                                <a [ngClass]="selectedBot == bot.name ? 'selected' : ''">{{ (bot.name)}}</a>
                            </li>
                            <!-- <li ngbDropdownItem class="channel-name m_b_2">
                                <a>Whatsapp</a>
                            </li>
                            <li ngbDropdownItem class="channel-name m_b_2">
                                <a>Slack</a>
                            </li> -->
                        </div>
                    </perfect-scrollbar>
                </ul>
            </div>
        </div>
        <!-- Channels -->
        <div class="kr-sg-dropdowns channels-drpdowns" ngbDropdown placement="bottom-right">
          <div class="dropdown-open">
              <button type="button" class="dropdown-toggle before-none dropdown-input" id="repdropdown2" ngbDropdownToggle>
                  <i class="icon-ast_channels"></i>
                  <span class="title-text" *ngIf="selectedChannel.length == 1">{{('DASHBOARD.CHANNEL_' + this.selectedChannel[0]) | translate}}</span>
                  <span class="title-text" *ngIf="selectedChannel.length == 2">{{'DASHBOARD.CHANNEL' | translate}}</span>
                  <span class="title-text" *ngIf="selectedChannel.length == 3">{{'DASHBOARD.CHANNELS' | translate}}</span>

                  <span class="count-channels" *ngIf="selectedChannel.length > 1">{{selectedChannel?.length}}</span>
              </button>
              <ul class="content-menu" aria-labelledby="repdropdown2" ngbDropdownMenu>
                  <perfect-scrollbar>
                      <div class="scroll-data mx-h-280">
                          <li class="channel-name m_b_2" *ngFor="let channel of channelList" >
                              <a  (click)="changeChannel(channel)" [ngClass]="(selectedChannel.indexOf(channel) != -1) ? 'selected' : ''">{{ ('DASHBOARD.CHANNEL_' + channel) | translate}}</a>
                          </li>
                          <!-- <li ngbDropdownItem class="channel-name m_b_2">
                              <a>Whatsapp</a>
                          </li>
                          <li ngbDropdownItem class="channel-name m_b_2">
                              <a>Slack</a>
                          </li> -->
                      </div>
                  </perfect-scrollbar>
              </ul>
          </div>
      </div>
        <!-- export -->
        <div class="export-btn d-none" (click)="export()">
            <i class="icon-ast_export"></i>
            <span>{{"DASHBOARD.EXPORT" | translate}}</span>
        </div>
    </div>
</div>
